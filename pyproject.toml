[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mimesisgym"
version = "0.1.0"
description = "Sandboxed visual-recreation evaluations for tool-using models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "unemployed vibecoder"}]
dependencies = [
  "numpy>=2.0",
  "openai>=2.33.0",
  "Pillow>=11.0",
  "python-dotenv>=1.0",
  "scikit-image>=0.25",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.12"]

[project.scripts]
mimesisgym = "mimesisgym.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["local_data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
